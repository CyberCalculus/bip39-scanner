name: BIP39 Scanner

on:
  workflow_dispatch:
    inputs:
      random_shuffles:
        description: 'Number of random shuffles per run (0 = full 12! enumeration)'
        required: false
        default: '100000'
      threads:
        description: 'Worker threads'
        required: false
        default: '4'
      checkpoint_artifact:
        description: 'Artifact name for checkpoint persistence'
        required: false
        default: 'bip39-checkpoint'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_artifact || 'bip39-checkpoint' }}
          path: .
        continue-on-error: true

      - name: Scan permutations
        run: |
          ./target/release/bip39-scanner check \
            -t bc1qcv84707v4sglaj306qezkcrun4eejh77k8cyjr \
            --words mad shop faint hub shock motion style fall lift excess episode bless \
            --random-shuffles ${{ inputs.random_shuffles || '100000' }} \
            --checkpoint cp.json \
            --resume \
            -T ${{ inputs.threads || '4' }} || exit_code=$?
          # exit 3 = no match found (expected), only fail on real errors
          if [ "${exit_code:-0}" -ne 3 ]; then exit "${exit_code:-0}"; fi
          echo "No match this run. Checkpoint saved for next run."

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.checkpoint_artifact || 'bip39-checkpoint' }}
          path: cp.json
          retention-days: 90
          overwrite: true
        if: always()
